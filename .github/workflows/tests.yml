name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y unixodbc xvfb
      - run: pip install .
      - run: python -c "import shutil; assert shutil.which(x27pgbridgex27)"
      - run: xvfb-run -a python -m unittest discover -s tests -t .
