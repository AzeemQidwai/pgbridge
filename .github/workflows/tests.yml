name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y unixodbc xvfb
      - run: pip install -r requirements.txt
      - run: xvfb-run -a python -m unittest test_safety test_enterprise_features test_qa_regressions test_size_estimates test_qa_ui
